<style>
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;padding:6px 5vw 0;font-size:16px}
.facts span b{font:400 22px var(--serif);margin-right:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:22px 5vw 0}
.filters button{border:1.5px solid rgba(29,40,71,.25);border-radius:999px;padding:4px 14px 4px 10px;font-size:14px;font-weight:500;background:rgba(255,255,255,.35);cursor:pointer;display:flex;align-items:center;gap:8px}
.filters button i{width:10px;height:10px;border-radius:50%;display:block;background:var(--lc)}
.filters button[aria-pressed=true]{background:var(--ink);color:#F2DDC9;border-color:var(--ink)}
.tl{position:relative;max-width:1180px;margin:30px auto 0;padding:20px 5vw 40px}
.spool{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(181,55,44,.15);border-radius:2px}
.spool i{position:absolute;left:0;top:0;width:3px;height:0;background:var(--thread);border-radius:2px;box-shadow:0 0 6px rgba(181,55,44,.35)}
.month{position:relative;z-index:2;display:flex;justify-content:center;margin:46px 0 20px}
.month span{background:var(--night);color:#EDE2D2;font:400 18px var(--serif);padding:6px 18px;border-radius:3px;box-shadow:0 8px 16px -10px rgba(0,0,0,.5);outline:1.5px dashed rgba(237,226,210,.45);outline-offset:-5px}
.ev{position:relative;display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;margin:18px 0}
.ev .knot{grid-column:2;grid-row:1;justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--thread);z-index:2;transform:scale(0);transition:transform .5s cubic-bezier(.2,.8,.2,1.4)}
.ev.in .knot{transform:scale(1)}
.card{grid-row:1;background:var(--card);border-radius:4px;box-shadow:0 18px 30px -22px rgba(29,40,71,.6);overflow:hidden;cursor:pointer;text-align:left;border:0;padding:0;font:inherit;color:inherit;
  opacity:0;transition:opacity .55s,transform .65s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.ev.l .card{grid-column:1;transform:translateX(-24px)}.ev.r .card{grid-column:3;transform:translateX(24px)}
.ev.in .card{opacity:1;transform:none}
.card:hover,.card:focus-visible{box-shadow:0 24px 36px -20px rgba(29,40,71,.7)}
.ev.in .card:hover{transform:translateY(-3px)}
.card canvas{display:block;width:100%;height:46px}
.card .inside{display:block;padding:14px 18px 16px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.card .top time{font:400 15px var(--serif)}
.card .tag{background:var(--lc);color:#F5EBDC;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.card h3{font:400 25px/1.1 var(--serif);margin:6px 0 2px}
.card .first{display:inline-block;margin:2px 0 6px;font:400 14px var(--serif);border-bottom:2px solid var(--thread)}
.card .what{display:block;margin:4px 0 10px;font-size:15px}
.card .size{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:13px;font-weight:500}
.card .size i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--lc),var(--thread))}
.card .more{display:block;margin-top:10px;font-size:13px;font-weight:600;opacity:.7}
.ev.next .card{outline:2px dashed rgba(181,55,44,.5);outline-offset:-6px}
.ev.hide{display:none}
.nextHead{position:relative;z-index:2;text-align:center;margin:60px 0 10px}
.nextHead span{display:inline-block;background:var(--thread);color:#FBEFE4;font:400 20px var(--serif);padding:8px 20px;border-radius:3px}
.nextHead p{margin:10px auto 0;max-width:46ch}
@media (max-width:820px){.spool{left:22px}.ev{grid-template-columns:44px 1fr}.ev .knot{grid-column:1}.ev.l .card,.ev.r .card{grid-column:2;transform:translateX(16px)}.month,.nextHead{justify-content:flex-start;text-align:left;padding-left:44px}}
@media (prefers-reduced-motion:reduce){.card{opacity:1;transform:none!important}.ev .knot{transform:none}}
</style>
</head>
<body data-page="timeline" data-sheet>
<div data-nav></div>
<main id="main">
<header class="pageHead"><h1 data-title data-style="drybrush">Timeline</h1><p>Every Loom we've published, in the order we made them. Follow the thread from the first Spark in August to the 4.5 family coming next.</p></header>
<div class="facts" id="facts"></div>
<div class="filters" id="filters" role="group" aria-label="Show one line"></div>
<div class="tl" id="tl"><div class="spool" aria-hidden="true"><i id="spool"></i></div></div>
</main>
<div data-footer></div>
<script src="data.js"></script><script src="painter.js"></script><script src="chrome.js"></script>
<script>
const {LINES,MIX,LINE_COL}=TLDATA, all=TLDATA.all(), tl=document.getElementById('tl');
const released=all.filter(m=>m.date).sort((a,b)=>a.date.localeCompare(b.date)||a.params-b.params);
const next=all.filter(m=>!m.date).sort((a,b)=>b.params-a.params);
const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const mon=d=>new Date(d).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const words=n=>n>=1?(Math.round(n*10)/10)+' million':Math.round(n*1000)+' thousand';
const minP=Math.min(...released.map(m=>m.params)), maxP=Math.max(...released.map(m=>m.params));
document.getElementById('facts').innerHTML='<span><b>'+released.length+'</b>Looms released</span><span>From <b style="margin-left:4px">'+words(minP)+'</b>to <b style="margin-left:6px">'+words(maxP)+'</b>parameters</span><span><b>'+next.length+'</b>more coming soon</span>';
const bar=p=>Math.max(4,Math.min(100,(Math.log10(p*1e6)-4)/(Math.log10(2e8)-4)*100));
let lastMon='', side=0;
function card(m,isNext){
  if(!isNext){ const mm=mon(m.date); if(mm!==lastMon){ tl.insertAdjacentHTML('beforeend','<div class="month"><span>'+mm+'</span></div>'); lastMon=mm; } }
  const ev=document.createElement('article'); ev.className='ev '+(side++%2?'r':'l')+(isNext?' next':''); ev.dataset.line=m.line; ev.style.setProperty('--lc',LINE_COL[m.line]);
  ev.innerHTML='<span class="knot" aria-hidden="true"></span><button class="card" aria-label="Open the label for '+m.name+'"><canvas></canvas><span class="inside"><span class="top"><time'+(m.date?' datetime="'+m.date+'"':'')+'>'+(m.date?fmt(m.date):'Coming soon')+'</time><span class="tag">'+m.lineName+'</span></span>'+
    '<h3>'+(m.name.startsWith('Loom')?m.name:'Loom '+m.name)+'</h3>'+(m.first?'<span class="first">'+m.first+'</span>':'')+'<span class="what">'+m.what+'</span>'+
    '<span class="size"><span>'+m.size+'</span><i style="width:'+bar(m.params)+'%"></i></span><span class="more">Read the label'+(m.demo?', or try it in your browser':'')+'</span></span></button>';
  tl.appendChild(ev);
  requestAnimationFrame(()=>{ const mix=MIX[m.line], c=ev.querySelector('canvas'); TL.paintSwatch(c,{mix,cell:9,seed:m.name.length*5,ground:mix.ground||'#F1DFCB'}); });
  ev.querySelector('.card').onclick=()=>openSheet(m);
}
released.forEach(m=>card(m,false));
tl.insertAdjacentHTML('beforeend','<div class="nextHead"><span>Next: the 4.5 family</span><p>Seven sizes from one training run. Each will get its date here when it is released.</p></div>');
next.forEach(m=>card(m,true));
const F=document.getElementById('filters');
F.innerHTML='<button aria-pressed="true" data-l="">All lines</button>'+LINES.map(l=>'<button aria-pressed="false" data-l="'+l.id+'" style="--lc:'+LINE_COL[l.id]+'"><i></i>'+l.name+'</button>').join('');
F.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; F.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  const l=b.dataset.l; document.querySelectorAll('.ev').forEach(ev=>ev.classList.toggle('hide',!!l&&ev.dataset.line!==l));
  document.querySelectorAll('.month').forEach(mo=>{ let n=mo.nextElementSibling, any=false; while(n&&n.classList.contains('ev')){ if(!n.classList.contains('hide')) any=true; n=n.nextElementSibling; } mo.style.display=any?'':'none'; });
  grow(); };
const spool=document.getElementById('spool');
function grow(){ const r=tl.getBoundingClientRect(); const seen=Math.min(tl.offsetHeight,Math.max(0,innerHeight*0.75-r.top)); spool.style.height=seen+'px';
  document.querySelectorAll('.ev:not(.in):not(.hide)').forEach(e=>{ if(e.getBoundingClientRect().top<innerHeight*0.82) e.classList.add('in'); }); }
addEventListener('scroll',grow,{passive:true}); addEventListener('resize',grow); grow(); setTimeout(grow,250);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){ document.querySelectorAll('.ev').forEach(e=>e.classList.add('in')); spool.style.height='100%'; }
</script>
</body>
</html>
